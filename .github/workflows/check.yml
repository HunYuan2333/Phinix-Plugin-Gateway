name: Check gateway

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gateway-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      WRANGLER_SEND_METRICS: 'false'
      WRANGLER_LOG_PATH: ${{ runner.temp }}/gateway-wrangler.log
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '26.10.0'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: python3 tests/ops-cli.test.py
      - run: python3 tests/network-check.test.py
      - run: python3 tests/live-probe.test.py
      - run: npm run test:native
